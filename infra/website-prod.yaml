#apiVersion: v1
#kind: Namespace
#metadata:
#  name: jstunnel-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jstunnel-website-deployment
  namespace: jstunnel-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jstunnel-website
  template:
    metadata:
      labels:
        app: jstunnel-website
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: jstunnel-website-container
          image: svtslv/jstunnel
          command: ['node', './dist/core/website/website-cli.js']
          ports:
            - containerPort: 9080
---
apiVersion: v1
kind: Service
metadata:
  name: jstunnel-website-service
  namespace: jstunnel-ns
spec:
  type: ClusterIP
  selector:
    app: jstunnel-website
  ports:
    - protocol: TCP
      port: 9080
      targetPort: 9080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jstunnel-website-middleware
  namespace: jstunnel-ns
spec:
  headers:
    customResponseHeaders:
      X-Powered-By: 'JsTunnel'
      Strict-Transport-Security: 'max-age=0; includeSubDomains'
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jstunnel.com-ingress
  namespace: jstunnel-ns
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: jstunnel-ns-jstunnel-website-middleware@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jstunnel.com
      secretName: jstunnel.com-tls
  rules:
    - host: jstunnel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jstunnel-website-service
                port:
                  number: 9080
